{% set name = "cmcrameri" %}
{% set version = "1.10" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 38a776359040674cb4028695faf0121d0ccadb40eee0c9834eb4947674962b7e

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python {{ python_min }}
    - pip
  run:
    - matplotlib-base
    - numpy
    - python >={{ python_min }}

test:
  requires:
    - python {{ python_min }}
  imports:
    - cmcrameri

about:
  home: https://github.com/callumrollo/cmcrameri
  license: MIT
  license_family: MIT
  license_file: LICENSE.txt
  summary: Perceptually uniform colourmaps for geosciences
  description: |
    cmcrameri is a Python wrapper around Fabio Crameri's perceptually uniform colour maps
    http://www.fabiocrameri.ch/colourmaps.php

extra:
  recipe-maintainers:
    - callumrollo
